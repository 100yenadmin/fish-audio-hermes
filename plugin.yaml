name: fish-audio
version: 1.3.0
description: "Fish Audio voices for Hermes: expressive text-to-speech, speech-to-text, a searchable voice library, voice cloning and voice design, in the CLI, every messaging gateway and the Desktop app. Disclosure — every synthesis, transcription, clone or design call is a paid Fish Audio API request billed to your Fish account (the free s2.1-pro-free model excepted, which Fish may use to improve its models); the plugin sends your key and the text, audio, file names and voice details you ask it to process to api.fish.audio (or the base_url you configure), reads your wallet for balance and model choice, stores your key in Hermes's .env, and collects no telemetry. The Desktop Voices page adds gateway routes under /api/plugins/fish-audio/, behind the Hermes dashboard's existing authentication. On that page, previews, clones and voice designs are billed; cloning a voice or saving a designed one creates a voice in your Fish account; cloning and deleting are confirmed on the page (a speaker-consent box, a typed voice name) instead of through Hermes's approval gate; and Use sets the profile's Fish voice, and its speech provider when none is set. Preview and design audio files are deleted from the gateway once returned; a design's audio is held in gateway memory so you can save it, until it is saved, a later design or save finds it over an hour old, or the gateway stops; clone uploads are deleted after the clone, or by the next upload once idle for 15 minutes. With a key set, Desktop reads your Fish wallet when an agent is selected and about every five minutes, for the status-bar credit; favourites stay in Desktop's plugin storage on that computer, and fetched previews stay in the window's memory until it closes."
author: Electric Sheep
kind: standalone
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.5"
license: Apache-2.0
homepage: https://github.com/100yenadmin/fish-audio-hermes
tags: [voice, tts, stt, speech, fish-audio, voice-cloning]
requires_env:
  - name: FISH_API_KEY
    description: "Fish Audio API key (free to create)"
    url: "https://fish.audio/app/api-keys"
    secret: true
config_schema:
  api_key:
    type: secret
    env: FISH_API_KEY
    label: "Fish Audio API key"
    description: "Create one free at https://fish.audio/app/api-keys"
  base_url:
    type: str
    default: "https://api.fish.audio"
    label: "API base URL"
    description: "Only change this for an enterprise self-hosted Fish Audio deployment (https, or http on loopback)."
  streaming:
    type: str
    choices: [auto, "off"]
    default: auto
    label: "Streaming voice"
    description: "auto streams speech sentence by sentence in Desktop and CLI voice mode on Hermes builds with the plugin streaming hook; off uses whole-file synthesis."
  transport:
    type: str
    choices: [http, ws]
    default: http
    label: "Streaming transport"
    description: "Diagnostics only. http (chunked POST, lowest measured first-audio latency) or ws (Fish's live WebSocket)."
  allow_free_model:
    type: bool
    default: true
    label: "Allow the free model"
    description: "Off: always use s2.1-pro, never s2.1-pro-free, even when it is asked for by name. Fish may use free-model requests to improve its models."
  operator_account:
    type: bool
    default: false
    label: "Operator-managed account"
    description: "Turn on when the Fish account belongs to this agent's operator. Hides the balance, plan, billing links and the account's own voices from the agent's users, and sends key or credit problems to the operator. Restart the gateway to update tool descriptions."
provides_tools: [fish_speak, fish_voices, fish_transcribe]
provides_hooks: [transform_llm_output, pre_tool_call]
