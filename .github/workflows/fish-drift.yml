name: Fish API drift
on:
  schedule: [{cron: "17 6 * * 1"}]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: {group: fish-drift, cancel-in-progress: false}
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.11"}
      - run: pip install pyyaml==6.0.2
      - name: Compare public upstream documents and all parity URLs
        run: |
          python scripts/fish_drift.py
          python scripts/parity_check.py --no-collect || echo '- parity_check failed.' >> drift/report.md
      - name: Open or comment on one drift issue
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if [ ! -s drift/report.md ]; then exit 0; fi
          gh label create fish-drift --color D93F0B --description 'Fish upstream API and documentation drift' --force
          n=$(gh issue list --state open --label fish-drift --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue view "$n" --json body,comments > drift/issue.json
            if python -c 'import json,pathlib,sys; issue=json.loads(pathlib.Path("drift/issue.json").read_text()); comments=issue["comments"]; text=pathlib.Path("drift/report.md").read_text().rstrip("\n"); latest=(comments[-1]["body"] if comments else issue["body"]).rstrip("\n"); sys.exit(0 if text == latest else 1)'; then
              echo 'Unchanged drift report; no comment.'; exit 0
            fi
            gh issue comment "$n" --body-file drift/report.md
          else gh issue create --title 'Fish API drift detected' --label fish-drift --body-file drift/report.md; fi
