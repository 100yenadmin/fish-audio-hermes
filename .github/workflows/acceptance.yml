name: Release acceptance (advisory)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  layer-a:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [upstream, evaos]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Real entry-point acceptance
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: acceptance/run.sh --host '${{ matrix.host }}' --plugin "$GITHUB_SHA" --out "$RUNNER_TEMP/acceptance" --layers a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: acceptance-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/acceptance/report.json
            ${{ runner.temp }}/acceptance/REPORT.md
