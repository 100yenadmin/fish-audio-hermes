name: Release acceptance (advisory)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  layer-a:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: [upstream, evaos]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
      # The upstream host builds the Hermes web UI; Hermes 0.23.0 and later install only on Node 26 or newer.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Real entry-point acceptance
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: acceptance/run.sh --host '${{ matrix.host }}' --plugin "$GITHUB_SHA" --out "$RUNNER_TEMP/acceptance" --layers a
      - name: Show the setup error
        if: failure()
        run: |
          f="$RUNNER_TEMP/acceptance/setup-error.txt"
          [ -f "$f" ] || exit 0
          echo '::error title=Acceptance setup failed::the reason is printed in this step and uploaded as setup-error.txt'
          # The text comes from git, uv and npm output, so stop workflow-command parsing while printing it.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat "$f" || true
          echo "::$token::"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: acceptance-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/acceptance/report.json
            ${{ runner.temp }}/acceptance/REPORT.md
            ${{ runner.temp }}/acceptance/setup-error.txt
            ${{ runner.temp }}/acceptance/pytest.txt
            ${{ runner.temp }}/acceptance/pytest-retry.txt
