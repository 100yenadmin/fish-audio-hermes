name: Release acceptance (advisory)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  layer-a:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: [upstream, evaos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v6
      # The upstream host builds the Hermes web UI; Hermes 0.23.0 and later install only on Node 26.4 or newer (`26` installs the newest 26.x).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Real entry-point acceptance
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: acceptance/run.sh --host '${{ matrix.host }}' --plugin "$GITHUB_SHA" --out "$RUNNER_TEMP/acceptance" --layers a
      - name: Show the setup error
        if: failure()
        run: |
          f="$RUNNER_TEMP/acceptance/setup-error.txt"
          [ -f "$f" ] || exit 0
          echo '::error title=Acceptance setup failed::the reason is printed in this step and uploaded as setup-error.txt'
          # The text comes from git, uv and npm output, so stop workflow-command parsing while printing it.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat "$f" || true
          echo "::$token::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/acceptance/report.json
            ${{ runner.temp }}/acceptance/REPORT.md
            ${{ runner.temp }}/acceptance/setup-error.txt
            ${{ runner.temp }}/acceptance/pytest.txt
            ${{ runner.temp }}/acceptance/pytest-retry.txt
