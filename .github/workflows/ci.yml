name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Hermes builds the plugin is checked against. Bump deliberately (README "Compatibility").
  HERMES_UPSTREAM_REPO: NousResearch/hermes-agent
  HERMES_RELEASE_SHA: f97608f178d1ffeca59860195ab7da295f7c8e5f    # v2026.9.24 (0.21.5) = requires_hermes floor
  HERMES_MAIN_SHA: df81f543f8209b6d131449d98da7b0037cafedf4       # main, 2026-10-05
  HERMES_FORK_REPO: electricsheephq/evaOS-hermes-desktop-app-adapter
  HERMES_FORK_SHA: 9844ebe82d64080c4329c3747d16c74aa06c18c3        # evaos-runtime-es.12-v0.21.5-r34.4 = the managed fleet (S7)

jobs:
  desktop:
    name: Desktop half (types, tests, bundle, SDK surface, loader scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Committed bundle matches source
        run: npm run check:bundle
      - name: Fetch the pinned Hermes Desktop SDKs and runtime loaders
        run: |
          for pair in "release $HERMES_UPSTREAM_REPO $HERMES_RELEASE_SHA" "main $HERMES_UPSTREAM_REPO $HERMES_MAIN_SHA" "fork $HERMES_FORK_REPO $HERMES_FORK_SHA"; do
            set -- $pair
            mkdir -p "pinned/$1"
            git -C "pinned/$1" init -q
            git -C "pinned/$1" remote add origin "https://github.com/$2.git"
            git -C "pinned/$1" sparse-checkout set apps/desktop/src/sdk apps/desktop/src/contrib
            git -C "pinned/$1" fetch -q --depth 1 origin "$3"
            git -C "pinned/$1" checkout -q FETCH_HEAD
          done
      - name: Every imported SDK name exists in all three pinned SDKs
        run: npm run check:sdk
      - name: Every pinned runtime loader accepts the bundle, and the trap fixture is caught
        run: npm run check:loader
      - name: No self-updater (catalog rule 3)
        run: |
          bad=$(grep -rlE "releases/latest|raw\.githubusercontent\.com" --include='*.js' --include='*.ts' --include='*.tsx' desktop src | xargs -r grep -lE "writeTextFile|renamePath|writeFile\(" || true)
          if [ -n "$bad" ]; then echo "self-updater pattern in: $bad"; exit 1; fi

  unit:
    name: Unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # fastapi + starlette (the gateway routes' test client) at the versions Hermes pins.
      - run: pip install "httpx>=0.27,<1" "websockets>=13,<16" "msgpack>=1.0,<2" "pyyaml>=6,<7" "pytest==8.4.2" "respx==0.22.0" "fastapi==0.133.1" "starlette==1.3.1"
      - run: python -m pytest -q
      - run: python scripts/parity_check.py

  hermes:
    name: Against Hermes (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [release, main, fork]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: plugin
      - name: Resolve pinned Hermes
        id: pin
        run: |
          case "${{ matrix.target }}" in
            release) echo "repo=$HERMES_UPSTREAM_REPO" >> "$GITHUB_OUTPUT"; echo "sha=$HERMES_RELEASE_SHA" >> "$GITHUB_OUTPUT" ;;
            main)    echo "repo=$HERMES_UPSTREAM_REPO" >> "$GITHUB_OUTPUT"; echo "sha=$HERMES_MAIN_SHA" >> "$GITHUB_OUTPUT" ;;
            fork)    echo "repo=$HERMES_FORK_REPO" >> "$GITHUB_OUTPUT"; echo "sha=$HERMES_FORK_SHA" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: hermes
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
      - name: Install Hermes from its own lockfile
        run: |
          cd hermes
          uv sync --frozen --no-dev
          uv pip install --python .venv/bin/python "msgpack>=1.0,<2" "pyyaml>=6,<7" "pytest==8.4.2" "respx==0.22.0"
      - name: hermes plugins validate (catalog admission checks)
        if: matrix.target == 'main' || matrix.target == 'release'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes/.venv/bin/hermes plugins validate plugin
      - name: Tests inside a real Hermes install (unit + loader integration)
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          FISH_AUDIO_HERMES_INTEGRATION: "1"
        run: cd plugin && ../hermes/.venv/bin/python -m pytest -q
